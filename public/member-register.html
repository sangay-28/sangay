<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Member Account | Sherubtse Clubs</title><link rel="stylesheet" href="css/portal.css"><script src="js/member-register.js" defer></script></head>
<body><header class="portal-top"><a href="index.html" class="portal-brand">Sherubtse <b>Clubs</b></a><a href="login.html">Sign in</a></header><main class="portal-auth"><section class="portal-card"><p class="eyebrow">MEMBER ACCOUNT</p><h1>Create your account</h1><p class="muted">Verify your account with a one-time code to create it and track your activity.</p><form id="registerForm"><label>Full name<input name="fullName" autocomplete="name" required maxlength="120"></label><label>Email<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>Course<input name="course" required maxlength="120" placeholder="e.g. BSc Data Science"></label><label>Year of study<select name="year" required><option value="">Choose year</option><option value="1">1st Year</option><option value="2">2nd Year</option><option value="3">3rd Year</option><option value="4">4th Year</option></select></label><label class="consent-label"><input name="consent" type="checkbox" required> I agree to the <a href="terms.html">terms and data-use notice</a>.</label><button class="portal-button" type="submit">Get verification code</button></form><form id="verifyForm" hidden><p id="codeSentTo" class="muted"></p><label>Six-digit email code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button class="portal-button" type="submit">Verify and create account</button><button id="resendButton" class="link-button" type="button">Send another code</button></form><p id="feedback" class="portal-feedback" role="status"></p></section></main><footer class="portal-footer"><a href="terms.html">Terms &amp; data use</a><a href="contact.html">Contact</a></footer></body></html>
