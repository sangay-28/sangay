<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Member &amp; Leader Sign In | Sherubtse Clubs</title><link rel="stylesheet" href="css/portal.css"><script src="js/otp-ui.js" defer></script><script src="js/login.js" defer></script></head>
<body><header class="portal-top"><a href="index.html" class="portal-brand">Sherubtse <b>Clubs</b></a><a href="admin.html">Administrator sign in</a></header><main class="portal-auth"><section class="portal-card"><p class="eyebrow">YOUR CLUBS ACCOUNT</p><h1>Welcome back</h1><p class="muted">Use a one-time code to sign in.</p><div class="role-choice" role="group" aria-label="Account type"><button class="role active" data-role="member" type="button">Member</button><button class="role" data-role="leader" type="button">Club leader</button></div><form id="loginForm"><input type="hidden" name="role" value="member"><label>Email<input name="email" type="email" autocomplete="username" required maxlength="254"></label><button class="portal-button" type="submit">Get a verification code</button></form><form id="verifyForm" hidden><p id="codeSentTo" class="muted"></p><p id="otpCountdown" class="muted" aria-live="polite"></p><label>Six-digit verification code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button class="portal-button" type="submit">Verify and sign in</button><button id="resendButton" class="link-button" type="button">Get another code</button></form><p id="feedback" class="portal-feedback" role="status"></p><p id="memberSignup" class="signup-link">New to Sherubtse Clubs? <a href="member-register.html">Create a member account</a></p><p class="leader-note" id="leaderNote" hidden>Club leader accounts are created by the administrator. Contact the Clubs Office if you need access.</p></section></main><footer class="portal-footer"><a href="index.html">Home</a><a href="clubs.html">Explore clubs</a><a href="contact.html">Contact</a></footer></body></html>
